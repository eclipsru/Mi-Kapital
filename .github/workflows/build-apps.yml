name: Build Android APK and Windows installer

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'assets/**'
      - 'public/**'
      - 'android/**'
      - 'electron/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'index.html'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish APK, EXE, and differential update bundle as latest GitHub release
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify tests, dark UI guard & update bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Run test suite & dark-design guards
        run: npm test
      - name: Verify production build & hot-update bundle
        run: |
          npm run build
          npm run bundle:update

  android:
    name: Android APK
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Set build version
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - name: Build APK
        env:
          VITE_SUPABASE_URL: https://txeasxiblszphfayvyye.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          npm run android:sync 2>&1 | tee android-build.log
          (cd android && ./gradlew --no-daemon --stacktrace assembleDebug) 2>&1 | tee -a android-build.log
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Mi-Kapital-1.0.${GITHUB_RUN_NUMBER}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-kapital-android-apk
          path: android/app/build/outputs/apk/debug/Mi-Kapital-1.0.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mi-kapital-android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows EXE installer & differential update bundle
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set build version
        shell: pwsh
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - name: Build installer and update bundle
        env:
          VITE_SUPABASE_URL: https://txeasxiblszphfayvyye.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        shell: pwsh
        run: |
          npm run desktop:build *>&1 | Tee-Object -FilePath desktop-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ver = "1.0.${{ github.run_number }}"
          $exe = "release/Mi-Kapital-Setup-$ver.exe"
          $blockmap = "$exe.blockmap"
          $latest = "release/latest.yml"
          $bundle = "release/app-bundle-$ver.pak.gz"
          $manifestPath = "release/app-update-manifest.json"

          foreach ($f in @($exe, $blockmap, $latest, $bundle, $manifestPath)) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing required release artifact: $f"
              exit 1
            }
          }

          $latestContent = Get-Content $latest -Raw
          if ($latestContent -notmatch "Mi-Kapital-Setup-$ver\.exe") {
            Write-Error "latest.yml does not reference ASCII installer Mi-Kapital-Setup-$ver.exe"
            exit 1
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLower()
          if ($manifest.bundleSha256.ToLower() -ne $actualHash) {
            Write-Error "Bundle SHA-256 mismatch in app-update-manifest.json"
            exit 1
          }
          Write-Host "Verified all Windows installer & differential update artifacts for v$ver"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mi-kapital-windows-exe
          path: |
            release/Mi-Kapital-Setup-*.exe
            release/Mi-Kapital-Setup-*.exe.blockmap
            release/latest.yml
            release/app-bundle-*.pak.gz
            release/app-update-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mi-kapital-windows-build-log
          path: desktop-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish verified release
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mi-kapital-android-apk
          path: app-files/android
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: mi-kapital-windows-exe
          path: app-files/windows
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Мой капитал v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            app-files/android/*.apk
            app-files/windows/*.exe
            app-files/windows/*.blockmap
            app-files/windows/latest.yml
            app-files/windows/*.pak.gz
            app-files/windows/app-update-manifest.json
          body: |
            Проверенная сборка приложения **«Мой капитал» v1.0.${{ github.run_number }}** в едином тёмном оформлении сайта.

            ### Файлы
            - **`Mi-Kapital-Setup-1.0.${{ github.run_number }}.exe`** — установщик для Windows (устанавливается один раз; дальнейшие обновления скачиваются прямо внутри приложения).
            - **`app-bundle-1.0.${{ github.run_number }}.pak.gz`** и **`app-update-manifest.json`** — быстрый пакет обновления интерфейса и логики (~140 КБ), загружаемый напрямую из приложения без переустановки.
            - **`Mi-Kapital-Setup-1.0.${{ github.run_number }}.exe.blockmap`** и **`latest.yml`** — дифференциальное блочное обновление оболочки Electron.
            - **`Mi-Kapital-1.0.${{ github.run_number }}.apk`** — сборка для Android.
