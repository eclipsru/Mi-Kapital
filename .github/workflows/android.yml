name: Android APK and widgets
on:
  push:
    branches: [main, 'arena/**']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - name: Resolve the same version as the Windows release for this commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"; VERSION="${VERSION#v}"
          else
            VERSION=""
            for i in $(seq 1 24); do
              RUN_NUMBER="$(gh api "repos/${{ github.repository }}/actions/workflows/windows.yml/runs?head_sha=${{ github.sha }}&per_page=1" --jq '.workflow_runs[0].run_number // empty')"
              if [[ -n "$RUN_NUMBER" ]]; then VERSION="2.0.$RUN_NUMBER"; break; fi
              sleep 5
            done
            if [[ -z "$VERSION" ]]; then
              echo "::error title=Android version alignment::No Windows workflow run found for this commit; refusing to publish a mismatched APK version."
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and package web assets
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build
          node scripts/build-android-assets.mjs
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Require persistent release signing
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error title=Android signing not configured::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets using the secure signing handoff. Private keys are never published as artifacts."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mi-kapital.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/mi-kapital.p12" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Verify signature and package
        shell: bash
        run: |
          APK="$(find "$ANDROID_SDK_ROOT"/build-tools -name apksigner | sort -V | tail -1)"
          "$APK" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Mi-Kapital-mobile.apk
          sha256sum Mi-Kapital-mobile.apk > Mi-Kapital-mobile.apk.sha256
      - name: Upload APK to published release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" Mi-Kapital-mobile.apk Mi-Kapital-mobile.apk.sha256 --clobber
      - name: Attach APK to the published release for this commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          for i in $(seq 1 40); do
            TAG="$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[] | select(.draft==false and .target_commitish=="${{ github.sha }}") | .tag_name' | head -1)"
            if [[ -n "$TAG" ]]; then
              gh release upload "$TAG" Mi-Kapital-mobile.apk Mi-Kapital-mobile.apk.sha256 --clobber
              echo "Attached Android APK to $TAG"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::No published release for this commit yet; APK retained as a branch artifact."
      - name: Retain branch build for inspection
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apk
          path: |
            Mi-Kapital-mobile.apk
            Mi-Kapital-mobile.apk.sha256
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mi-kapital.p12"
