plugins { id 'com.android.application' }
def androidShellVersion = new groovy.json.JsonSlurper().parseText(file('../shell-version.json').text).version
android {
    namespace 'ru.eclipsru.mikapital'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.eclipsru.mikapital'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName System.getenv('APP_VERSION_NAME') ?: '2.1.0'
        buildConfigField 'int', 'SHELL_VERSION', String.valueOf(androidShellVersion)
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'mi-kapital'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
